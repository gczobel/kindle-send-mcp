[project]
name = "kindle-send-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.1",
    "resend>=2.42.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Repo style: Optional/typing annotations are used throughout, and the send
# path deliberately catches all exceptions to report a "failed" status.
ignore = ["BLE001", "UP045"]
