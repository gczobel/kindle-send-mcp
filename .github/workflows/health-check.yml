# .github/workflows/health-check.yml
name: Health check

on:
  schedule:
    # Monthly. No live Amazon session exists anymore to invalidate
    # between checks, so a low frequency is enough to catch SMTP
    # credential rot before a real send hits it.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - env:
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python scripts/health_check.py
